name: Build

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Target platform
        type: choice
        default: Android
        options:
          - Android
          - WebGL
  push:
    tags:
      - 'v*'

concurrency:
  group: build-${{ github.ref }}-${{ inputs.platform || 'Android' }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build for ${{ inputs.platform || 'Android' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      TARGET_PLATFORM: ${{ inputs.platform || 'Android' }}
    steps:
      # The Unity editor image does not fit on a stock runner.
      - uses: jlumbroso/free-disk-space@36e9a5af4eddb91fc11aec4c6f6f79b3cc0cb523 # main, 2026-10-06
        with:
          tool-cache: false
          large-packages: false
          swap-storage: false

      - uses: actions/checkout@v7

      # Audio/Licensed is a private repository; a read-only deploy key fetches it.
      - env:
          LICENSED_DEPLOY_KEY: ${{ secrets.LICENSED_DEPLOY_KEY }}
        run: |
          key="$HOME/.ssh/licensed_key"
          fail() { echo "::error::$1"; exit 1; }
          [ -n "$LICENSED_DEPLOY_KEY" ] || fail "The LICENSED_DEPLOY_KEY secret is empty or missing"
          mkdir -p ~/.ssh
          # A key pasted on Windows may carry CR line endings, which ssh rejects.
          printf '%s\n' "$LICENSED_DEPLOY_KEY" | tr -d '\r' > "$key"
          chmod 600 "$key"
          ssh-keygen -y -f "$key" > /dev/null 2>&1 || fail "LICENSED_DEPLOY_KEY is not a valid private key"
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2> /dev/null
          export GIT_SSH_COMMAND="ssh -i $key -o IdentitiesOnly=yes"
          git -c url."git@github.com:".insteadOf="https://github.com/" submodule update --init \
            || fail "Could not fetch Audio/Licensed: $($GIT_SSH_COMMAND -T git@github.com 2>&1 | tail -n 1)"
          rm "$key"
          [ -n "$(ls Assets/_DiceBattle/Audio/Licensed)" ] || fail "Audio/Licensed is empty after the fetch"

      - id: name
        run: |
          # A release tag defines the version; other builds take it from the project settings.
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(grep -oP '^\s*bundleVersion: \K\S+' ProjectSettings/ProjectSettings.asset)"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "value=DiceBattle-$version-b$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        with:
          path: Library
          key: Library-${{ env.TARGET_PLATFORM }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: Library-${{ env.TARGET_PLATFORM }}-

      - uses: game-ci/unity-builder@v6
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: ${{ env.TARGET_PLATFORM }}
          buildName: ${{ steps.name.outputs.value }}
          versioning: Custom
          version: ${{ steps.name.outputs.version }}
          androidVersionCode: ${{ github.run_number }}

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.name.outputs.value }}-${{ env.TARGET_PLATFORM }}
          path: build/${{ env.TARGET_PLATFORM }}
          if-no-files-found: error
          retention-days: 14

      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/Android/*.apk
          fail_on_unmatched_files: true
