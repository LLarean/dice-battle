<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>{{{ PRODUCT_NAME }}}</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
    #game { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: #000; }
    #unity-canvas { display: block; background: #231f20; outline: none; touch-action: none; }
    #loading { position: absolute; left: 50%; top: 50%; width: 40%; max-width: 240px; height: 6px; transform: translate(-50%, -50%); background: #3a3335; border-radius: 3px; overflow: hidden; }
    #loading-fill { width: 0; height: 100%; background: #c9a227; }
    #fullscreen { position: absolute; right: 12px; bottom: 12px; width: 40px; height: 40px; padding: 0; border: 0; border-radius: 6px; background: rgba(255, 255, 255, 0.15); cursor: pointer; }
    #fullscreen:hover { background: rgba(255, 255, 255, 0.3); }
    #fullscreen svg { width: 24px; height: 24px; fill: #fff; }
  </style>
</head>
<body>
  <div id="game">
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="loading"><div id="loading-fill"></div></div>
    <button id="fullscreen" type="button" aria-label="Fullscreen">
      <svg viewBox="0 0 24 24"><path d="M3 3h7v2H5v5H3zm11 0h7v7h-2V5h-5zM3 14h2v5h5v2H3zm16 0h2v7h-7v-2h5z"/></svg>
    </button>
  </div>
  <script>
    // The game is portrait only: a window wider than 9:16 gets a 9:16 canvas with black bars,
    // a narrower one (a phone) is filled whole down to 9:21, the tallest screen the layout supports.
    var portraitAspect = 9 / 16;
    var tallestAspect = 9 / 21;
    var game = document.querySelector("#game");
    var canvas = document.querySelector("#unity-canvas");
    var fullscreenButton = document.querySelector("#fullscreen");

    // iPhone Safari has no element fullscreen.
    if (game.requestFullscreen === undefined) {
      fullscreenButton.remove();
    }

    function layout() {
      var width = game.clientWidth;
      var height = game.clientHeight;

      if (width / height > portraitAspect) {
        width = Math.round(height * portraitAspect);
      } else if (width / height < tallestAspect) {
        height = Math.round(width / tallestAspect);
      }

      canvas.style.width = width + "px";
      canvas.style.height = height + "px";
    }

    window.addEventListener("resize", layout);
    document.addEventListener("fullscreenchange", layout);
    layout();

    fullscreenButton.addEventListener("click", function () {
      if (document.fullscreenElement) {
        document.exitFullscreen();
      } else {
        game.requestFullscreen();
      }
    });

    var buildUrl = "Build";
    var config = {
      arguments: [],
      dataUrl: buildUrl + "/{{{ DATA_FILENAME }}}",
      frameworkUrl: buildUrl + "/{{{ FRAMEWORK_FILENAME }}}",
#if USE_THREADS
      workerUrl: buildUrl + "/{{{ WORKER_FILENAME }}}",
#endif
#if USE_WASM
      codeUrl: buildUrl + "/{{{ CODE_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
      symbolsUrl: buildUrl + "/{{{ SYMBOLS_FILENAME }}}",
#endif
      streamingAssetsUrl: "StreamingAssets",
      companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
      productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
      productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
      // A phone screen at 3x would render three times the pixels for no visible gain.
      devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2),
    };

    var script = document.createElement("script");
    script.src = buildUrl + "/{{{ LOADER_FILENAME }}}";
    script.onload = function () {
      createUnityInstance(canvas, config, function (progress) {
        document.querySelector("#loading-fill").style.width = 100 * progress + "%";
      }).then(function () {
        document.querySelector("#loading").remove();
      }).catch(function (message) {
        console.error(message);
      });
    };
    document.body.appendChild(script);
  </script>
</body>
</html>
